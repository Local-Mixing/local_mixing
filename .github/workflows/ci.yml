name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pyo3 needs a Python interpreter at build time to compile the cdylib.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Installs the toolchain pinned in rust-toolchain.toml (rustc + rustfmt + clippy).
      - name: Install pinned toolchain
        run: rustup show

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      # Fails on clippy *errors* (e.g. correctness lints). Pre-existing style
      # warnings are allowed for now (no `-D warnings`); tighten later if desired.
      - name: Clippy
        run: cargo clippy

      - name: Build
        run: cargo build
