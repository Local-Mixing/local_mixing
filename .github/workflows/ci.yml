name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Test against the minimum supported Python version in pyproject.toml.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Installs the toolchain pinned in rust-toolchain.toml (rustc + rustfmt + clippy).
      # `rustup toolchain install` with no args reads rust-toolchain.toml; the old
      # `rustup show` install side effect was removed in rustup 1.28.
      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: |
          cargo fmt --all -- --check
          # rustfmt does not traverse topic files brought in with include!.
          rustfmt --check --edition 2024 tests/unit/engine/mixer/*.rs

      # Fails on clippy *errors* (e.g. correctness lints). Pre-existing style
      # warnings are allowed for now (no `-D warnings`); tighten later if desired.
      - name: Clippy
        run: cargo clippy --locked

      - name: Build
        run: cargo build --locked

      - name: Check ordinary runtime dependencies
        run: |
          cargo tree --locked --no-default-features --edges normal --prefix none > /tmp/runtime-dependencies.txt
          python - <<'PY'
          from pathlib import Path
          names = {line.split()[0] for line in Path('/tmp/runtime-dependencies.txt').read_text().splitlines() if line.strip()}
          assert not names.intersection({'rocksdb', 'librocksdb-sys', 'rhai', 'pyo3', 'numpy', 'lmdb', 'lmdb-sys'}), names
          PY

      # tdp_packing (stage 4) against Python-oracle fixtures in tests/fixtures/stage4.
      - name: Runtime and command correctness
        run: cargo test --locked --lib --test circuit_cli --test tdp_packing

      # The managed driver runs all four stages (docs/STAGE4_RUST_DESIGN.md §11).
      # tdp_defaults diffs its transcript against the oracle script
      # val_chain.sh itself (sandboxed, on recording mocks); stage12_parity
      # runs the real gen at n=16 both ways; reproduce_small needs a frozen
      # store and skips here (the stage4-oracle job covers stage 4).
      - name: TDP script flags and block sizing
        run: |
          bash tests/shell/tdp_flags.bash
          bash tests/shell/tdp_block_size.bash
          LOCAL_MIXING_BIN="$PWD/target/debug/local_mixing_bin" bash tests/shell/tdp_defaults.bash
          bash tests/shell/tdp_seeds.bash
          bash tests/shell/tdp_stage4_resume.bash
          TDP_STAGE_BIN="$PWD/target/debug" bash tests/shell/tdp_stage12_parity.bash
          bash tests/shell/tdp_reproduce_small.bash

      # The Python stage-4 prototypes are the canonical ORACLE of the Rust
      # stage 4; the stage4-oracle job runs them. Here: they still parse.
      - name: Stage-4 oracle scripts parse
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in sorted(Path('scripts/windowed_delivery').rglob('*.py')):
              compile(path.read_text(), str(path), 'exec')
          PY
          for script in scripts/windowed_delivery/waist/*.sh; do bash -n "$script"; done

      - name: Python gadget, gauntlet, and plotting correctness
        run: |
          python -m pip install numpy matplotlib
          python -B -m unittest discover -s tests/python -v

      - name: SAT encoder and solver workflow correctness
        run: python -B -m unittest security_tests.sat_solve.test_workflow -v

      - name: Frozen database correctness tests
        run: cargo test --locked --test frozen_roundtrip --test mixer_db_replacement

      # Run the existing library and command-parser tests.
      # Tests requiring prebuilt external stores remain explicitly ignored.
      - name: Database generation unit and command correctness
        run: |
          cargo test --locked --features db-tools --lib db_generation::
          cargo test --locked --features db-tools --bin local_mixing_bin

      - name: Regular band merge correctness
        run: cargo test --locked --features db-tools --test frozen_roundtrip rocksdb_bands_merge_keys_and_deduplicate_candidates_within_the_shard -- --exact

      - name: Check security and benchmark tools
        run: cargo check --locked --all-targets --features "db-tools security-tools benchmark-tools"

      - name: Trace-affine heatmap and plot analysis correctness
        run: |
          cargo test --locked --features security-tools --bin hmap_trace_affine
          # hmap_affine --exposure on the stage-4 C-view engine, byte-compared
          # with outputs of the pinned baseline binary (tests/fixtures/stage4).
          cargo test --locked --features security-tools --test hmap_affine_exposure
          python -B security_tests/heatmaps/plot_hmap_trace.py --self-test

      - name: Build and install Python extension
        run: python -m pip install .

      - name: Check Python heatmap API
        run: |
          python - <<'PY'
          import local_mixing

          for name in (
              "heatmap", "heatmap_subsampled", "heatmap_incremental",
              "heatmap_small", "heatmap_slice", "heatmap_mini_slice",
              "heatmap_corner", "heatmap_corner_at",
          ):
              assert callable(getattr(local_mixing, name)), name
          PY

  # The Python stage-4 ORACLE against tdp_packing on fresh random inputs on
  # every push (docs/STAGE4_RUST_DESIGN.md §10.6): pack, repair and emit,
  # byte for byte. The oracle runs under CPython 3.9 (set iteration order
  # decides the ANF caps; the self-test pins the semantics, not the version
  # string) with the baseline hmap_affine built from 492564f0, never from the
  # tree under test.
  stage4-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: CPython 3.9 set-order self-test
        run: python -I tests/fixtures/stage4/pyset_selftest.py tests/fixtures/stage4/pyset39_traces.txt tests/fixtures/stage4/pyset39_large.txt

      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Cache the baseline hmap_affine (492564f0)
        uses: actions/cache@v4
        with:
          path: baseline_target/release/hmap_affine
          key: hmap-affine-baseline-492564f0-${{ runner.os }}-v1

      - name: Baseline hmap_affine from 492564f0
        run: |
          if [ ! -x baseline_target/release/hmap_affine ]; then
            git worktree add --detach "$RUNNER_TEMP/baseline_src" 492564f0
            (cd "$RUNNER_TEMP/baseline_src" && rustup toolchain install &&
             CARGO_TARGET_DIR="$GITHUB_WORKSPACE/baseline_target" \
               cargo build --locked --release --features security-tools --bin hmap_affine)
          fi
          sha=$(sha256sum baseline_target/release/hmap_affine | cut -d' ' -f1)
          echo "baseline hmap_affine sha256 $sha (built from 492564f0 in this job)"
          # accept this job's own build as the pinned baseline (it was built from
          # 492564f0 above, not from the tree under test)
          echo "$sha linux CI build of 492564f0" >> tests/fixtures/stage4/cview_n8/baseline_sha256.txt

      - name: Build tdp_packing
        run: cargo build --locked --release --bin tdp_packing

      - name: Differential test (20 random pack + repair/emit cases)
        run: |
          TDP_PACKING=target/release/tdp_packing \
          HMAP_BASELINE="$GITHUB_WORKSPACE/baseline_target/release/hmap_affine" \
          ORACLE_PY="$(command -v python)" WORK="$RUNNER_TEMP/diff" \
            bash tests/stage4/differential.sh "${{ github.run_id }}" 20

      - name: Upload the failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stage4-differential-failure
          path: ${{ runner.temp }}/diff/fail_*
