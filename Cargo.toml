[package]
name = "local_mixing"
version = "0.1.0"
edition = "2024"
default-run = "local_mixing_bin"

[lib]
name = "local_mixing"            
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "local_mixing_bin"        
path = "src/main.rs"

[profile.release]
overflow-checks = true

[dependencies]
rand = "0.9.0"
rayon = "1.10.0"
serde = { version = "1.0.217", features = ["derive"] }
bincode = "1.3.3"
rusqlite = { version = "0.33.0", features = ["bundled"] }
lru = "0.12"
itertools = "0.13"
once_cell = "1.19"
dashmap = "6.1.0"
crossbeam = "0.8.4"
clap = { version = "4.5.46", features = ["derive"] }
smallvec = "1.15.1"
ctrlc = "3.2"
fastrand = "2.3.0"
plotters = "0.3"
pyo3 = { version = "0.27.1", features = ["extension-module"] }
numpy = "0.27.0"
lmdb = "0.8.0"
libc = "0.2.178"
lmdb-sys = "0.8.0"
signal-hook = "0.3.18"
crossbeam-channel = "0.5.15"
primitive-types = "0.14.0"
heed = "0.22.0"
rocksdb = "0.24.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
num_cpus = "1.17.0"
num-bigint = "0.4.6"
nauty-Traces-sys = "0.11.0"
num-traits = "0.2.19"
rng-entropy = "0.5.0"
cryptography = { package = "cryptography-rs", version = "0.5.0" }