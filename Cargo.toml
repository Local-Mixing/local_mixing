[package]
name = "local_mixing"
version = "0.1.0"
edition = "2024"
default-run = "local_mixing_bin"

[lib]
name = "local_mixing"            
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "local_mixing_bin"
path = "src/main.rs"

[[bin]]
name = "bench_canon4"
path = "src/bench/bench_canon4.rs"

[[bin]]
name = "bench_polycanon"
path = "src/bench/bench_polycanon.rs"

[[bin]]
name = "sandwich_obf"
path = "src/bin/sandwich_obf.rs"

[[bin]]
name = "gen_lowweight_challenge"
path = "src/bin/gen_lowweight_challenge.rs"

[[bin]]
name = "attack_lowweight"
path = "src/bin/attack_lowweight.rs"

[[bin]]
name = "attack_lowweight_plain"
path = "src/bin/attack_lowweight_plain.rs"

[[bin]]
name = "attack_lowweight_struct"
path = "src/bin/attack_lowweight_struct.rs"

[[bin]]
name = "attack_lowweight_gray"
path = "src/bin/attack_lowweight_gray.rs"

[[bin]]
name = "attack_lowweight128"
path = "src/bin/attack_lowweight128.rs"

[[bin]]
name = "attack_lowweight_cnf"
path = "src/bin/attack_lowweight_cnf.rs"

[[bin]]
name = "attack_lowweight_kill"
path = "src/bin/attack_lowweight_kill.rs"

[[bin]]
name = "attack_lowweight_enum"
path = "src/bin/attack_lowweight_enum.rs"

[[bin]]
name = "attack_lowweight_support"
path = "src/bin/attack_lowweight_support.rs"

[[bin]]
name = "attack_lowweight_plain_cnf"
path = "src/bin/attack_lowweight_plain_cnf.rs"

[[bin]]
name = "eval_lowweight"
path = "src/bin/eval_lowweight.rs"

[profile.release]
overflow-checks = true

[dependencies]
rand = "0.9.0"
rayon = "1.10.0"
serde = { version = "1.0.217", features = ["derive"] }
lru = "0.12"
itertools = "0.13"
once_cell = "1.19"
dashmap = "6.1.0"
crossbeam = "0.8.4"
clap = { version = "4.5.46", features = ["derive"] }
smallvec = "1.15.1"
ctrlc = "3.2"
fastrand = "2.3.0"
lmdb = "0.8.0"
libc = "0.2.178"
lmdb-sys = "0.8.0"
signal-hook = "0.3.18"
primitive-types = "0.14.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
num_cpus = "1.17.0"
num-bigint = "0.4.6"
nauty-Traces-sys = { version = "0.11.0" }
num-traits = "0.2.19"
rng-entropy = "0.5.0"
cryptography = { package = "cryptography-rs", version = "0.5.0" }
rustc-hash = "2"
indicatif = "0.17"

[[bin]]
name = "dump_ones"
path = "src/bin/dump_ones.rs"

[[bin]]
name = "dump_s8_exact11"
path = "src/bin/dump_s8_exact11.rs"

[[bin]]
name = "check_plain_obf"
path = "src/bin/check_plain_obf.rs"

[[bin]]
name = "sandwich_viz_export"
path = "src/bin/sandwich_viz_export.rs"

[[bin]]
name = "attack_partial_zero"
path = "src/bin/attack_partial_zero.rs"
