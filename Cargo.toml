[package]
name = "local_mixing"
version = "0.1.0"
edition = "2024"
default-run = "local_mixing_bin"

[lib]
name = "local_mixing"            
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "local_mixing_bin"
path = "src/main.rs"

# Standalone "challenge" binaries (pulled from eb/dev). Not in src/bin so they stay
# out of the main source tree; explicit paths make them runnable via `cargo run --bin <name>`.
[[bin]]
name = "block_cipher"
path = "challenges/block_cipher.rs"

[[bin]]
name = "point_function"
path = "challenges/point_function.rs"

[[bin]]
name = "poly_canon"
path = "challenges/poly_canon.rs"

[[bin]]
name = "newton_feistal"
path = "challenges/newton_feistal.rs"

[[bin]]
name = "bench_canon4"
path = "src/bench/bench_canon4.rs"

[[bin]]
name = "bench_polycanon"
path = "src/bench/bench_polycanon.rs"

[[bin]]
name = "bench_canon_windows"
path = "src/bench/bench_canon_windows.rs"

[[bin]]
name = "canon_digest"
path = "src/bin/canon_digest.rs"

[[bin]]
name = "db_value_stats"
path = "src/bin/db_value_stats.rs"
required-features = ["legacy-db-tools"]

[[bin]]
name = "expand_sample"
path = "src/bin/expand_sample.rs"

# Research heatmap sampler. Keeping the experiment source as the canonical
# implementation makes the 4n fixed-slice/free-helper binary reproducible.
[[bin]]
name = "hmap_affine_fixed_slice"
path = "experiments/affine_heatmaps_compact300_20260722/tools/hmap_affine_fixed_slice.rs"

# Held-out statistical companion to the exact affine reader. Candidate
# selection is frozen on training lanes before agreement is measured on
# disjoint holdout lanes.
[[bin]]
name = "hmap_stat"
path = "src/bin/hmap_stat.rs"

# Fast 64-lane semantic guard for strict 4n TDP artifacts. Its command-line
# evidence is compatible with the existing Python slice-check logs.
[[bin]]
name = "slice_check_4n"
path = "src/bin/slice_check_4n.rs"

# Rainbow-table (replacement DB) pipeline tools, ported from the dbgen server
# tree; see src/rainbow_table/mod.rs. Pipeline validators live as #[ignore]d
# tests in src/rainbow_table/validation_tests.rs, not bins.
[[bin]]
name = "build_curated"
path = "src/rainbow_table/bin/build_curated.rs"
required-features = ["legacy-db-tools"]

[[bin]]
name = "curated_to_lmdb"
path = "src/rainbow_table/bin/curated_to_lmdb.rs"
required-features = ["legacy-db-tools"]

[[bin]]
name = "merge_rocks_parallel"
path = "src/rainbow_table/bin/merge_rocks_parallel.rs"
required-features = ["legacy-db-tools"]

# Frozen-table toolchain: builder/validator, replay + pilot benchmarks,
# filter persistence, probe-pack generator, data-stats samplers.
[[bin]]
name = "frozen_table"
path = "src/rainbow_table/bin/frozen_table.rs"
required-features = ["legacy-db-tools"]

[[bin]]
name = "frozen_replay"
path = "src/rainbow_table/bin/frozen_replay.rs"
required-features = ["legacy-db-tools"]

[[bin]]
name = "frozen_pilot"
path = "src/rainbow_table/bin/frozen_pilot.rs"

[[bin]]
name = "frozen_reencode"
path = "src/rainbow_table/bin/frozen_reencode.rs"

[[bin]]
name = "frozen_filter_persist"
path = "src/rainbow_table/bin/frozen_filter_persist.rs"

[[bin]]
name = "make_probes"
path = "src/rainbow_table/bin/make_probes.rs"
required-features = ["legacy-db-tools"]

[[bin]]
name = "frozen_calibrate2"
path = "src/rainbow_table/bin/frozen_calibrate2.rs"
required-features = ["legacy-db-tools"]

[[bin]]
name = "rocks_value_stats"
path = "src/rainbow_table/bin/value_stats.rs"
required-features = ["legacy-db-tools"]

[[bin]]
name = "friend_stats"
path = "src/rainbow_table/bin/friend_stats.rs"
required-features = ["legacy-db-tools"]

[features]
default = []
# Offline migration/build/validation tools for the retired LMDB/RocksDB
# stores. Runtime mixing and compression never enable this feature.
legacy-db-tools = [
    "dep:crossbeam-channel",
    "dep:lmdb",
    "dep:num_cpus",
    "dep:rocksdb",
]

[profile.release]
overflow-checks = false
lto = "thin"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true

[dependencies]
rand = "0.9.0"
rayon = "1.10.0"
serde = { version = "1.0.217", features = ["derive"] }
lru = "0.12"
itertools = "0.13"
once_cell = "1.19"
dashmap = "6.1.0"
clap = { version = "4.5.46", features = ["derive"] }
smallvec = "1.15.1"
ctrlc = "3.2"
fastrand = "2.3.0"
pyo3 = { version = "0.27.1", features = ["extension-module"] }
numpy = "0.27.0"
lmdb = { version = "0.8.0", optional = true }
signal-hook = "0.3.18"
primitive-types = "0.14.0"
uint = "0.10.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rustc-hash = "2"
# Rainbow-table DB generation pipeline (src/rainbow_table).
rocksdb = { version = "0.24.0", optional = true }
crossbeam-channel = { version = "0.5.15", optional = true }
num_cpus = { version = "1.17.0", optional = true }
# Frozen-table read path (src/replace/frozen.rs).
xorf = { version = "0.12", features = ["serde", "bincode"] }
bincode2 = { package = "bincode", version = "2" }
# Runtime-pluggable outgoing/incoming rankers for the isolated R-SSG stack.
rhai = { version = "1.21", features = ["sync"] }
# Needed by the challenge binaries (block_cipher, poly_canon).
rng-entropy = "0.5.0"
cryptography = { package = "cryptography-rs", version = "0.5.0" }
