path = "red_team_tests/bin/oracle/oracle_gate_learn.rs"

[[bin]]
name = "oracle_preimage_game"
path = "red_team_tests/bin/oracle/oracle_preimage_game.rs"

[[bin]]
name = "persistence_census"
path = "red_team_tests/bin/leakage/persistence_census.rs"

[[bin]]
name = "sampled_trace_support"
path = "red_team_tests/bin/leakage/sampled_trace_support.rs"

[[bin]]
name = "source_stats"
path = "red_team_tests/bin/leakage/source_stats.rs"

[[bin]]
name = "stress_battery"
path = "red_team_tests/bin/leakage/stress_battery.rs"

[[bin]]
name = "prod_grid"
path = "red_team_tests/bin/fixtures/prod_grid.rs"

[[bin]]
name = "regen_sandwich_c"
path = "red_team_tests/bin/fixtures/regen_sandwich_c.rs"

[features]
default = []
# Offline import/regeneration tools for the historical replacement databases.
# Runtime lookup does not pull in RocksDB.
legacy-db-tools = [
    "dep:crossbeam-channel",
    "dep:lru",
    "dep:num_cpus",
    "dep:rocksdb",
]

[profile.release]
# Explicit (it is also the release default): wrapping arithmetic is relied on in
# hot paths, while debug builds retain overflow checks for tests.
overflow-checks = false
lto = "thin"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true

[dependencies]
rand = "0.9.0"
rayon = "1.10.0"
serde = { version = "1.0.217", features = ["derive"] }
itertools = "0.13"
once_cell = "1.19"
dashmap = "6.1.0"
clap = { version = "4.5.46", features = ["derive"] }
smallvec = "1.15.1"
ctrlc = "3.2"
fastrand = "2.3.0"
pyo3 = { version = "0.27.1", features = ["extension-module"] }
numpy = "0.27.0"
lmdb = "0.8.0"
libc = "0.2.178"
signal-hook = "0.3.18"
primitive-types = "0.14.0"
uint = "0.10.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rustc-hash = "2"
# Curated database build/import pipeline. These are optional because RocksDB
# is not part of the frozen-store runtime.
rocksdb = { version = "0.24.0", optional = true }
num_cpus = { version = "1.17.0", optional = true }
crossbeam-channel = { version = "0.5.15", optional = true }
lru = { version = "0.12", optional = true }
# Frozen-table read path (src/db_mixing/frozen.rs): xorf provides the optional
# in-RAM BinaryFuse8 miss filter, bincode2 decodes the persisted filters.bin.
xorf = { version = "0.12", features = ["serde", "bincode"] }
bincode2 = { package = "bincode", version = "2" }
# Embedded scripting for swappable ranking functions (outgoing/incoming subcircuit selection).
# `sync` makes Engine/AST Send+Sync so a script ranker can be shared across rayon threads.
rhai = { version = "1.21", features = ["sync"] }
# Needed by the challenge binaries (block_cipher, poly_canon).
rng-entropy = "0.5.0"
cryptography = { package = "cryptography-rs", version = "0.5.0" }
