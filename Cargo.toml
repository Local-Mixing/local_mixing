[package]
name = "local_mixing"
version = "0.1.0"
edition = "2024"
default-run = "local_mixing_bin"

[lib]
name = "local_mixing"            
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "local_mixing_bin"
path = "src/main.rs"

# Standalone "challenge" binaries (pulled from eb/dev). Not in src/bin so they stay
# out of the main source tree; explicit paths make them runnable via `cargo run --bin <name>`.
[[bin]]
name = "block_cipher"
path = "challenges/block_cipher.rs"

[[bin]]
name = "point_function"
path = "challenges/point_function.rs"

[[bin]]
name = "poly_canon"
path = "challenges/poly_canon.rs"

[[bin]]
name = "newton_feistal"
path = "challenges/newton_feistal.rs"

[[bin]]
name = "bench_canon4"
path = "src/bench/bench_canon4.rs"

[[bin]]
name = "bench_polycanon"
path = "src/bench/bench_polycanon.rs"

[[bin]]
name = "bench_canon_windows"
path = "src/bench/bench_canon_windows.rs"

[[bin]]
name = "canon_digest"
path = "src/bin/canon_digest.rs"

[[bin]]
name = "db_value_stats"
path = "src/bin/db_value_stats.rs"

[[bin]]
name = "expand_sample"
path = "src/bin/expand_sample.rs"

# Rainbow-table (replacement DB) pipeline tools, ported from the dbgen server
# tree; see src/rainbow_table/mod.rs. Pipeline validators live as #[ignore]d
# tests in src/rainbow_table/validation_tests.rs, not bins.
[[bin]]
name = "build_curated"
path = "src/rainbow_table/bin/build_curated.rs"

[[bin]]
name = "curated_to_lmdb"
path = "src/rainbow_table/bin/curated_to_lmdb.rs"

[[bin]]
name = "merge_rocks_parallel"
path = "src/rainbow_table/bin/merge_rocks_parallel.rs"

# Frozen-table toolchain: builder/validator, replay + pilot benchmarks,
# filter persistence, probe-pack generator, data-stats samplers.
[[bin]]
name = "frozen_table"
path = "src/rainbow_table/bin/frozen_table.rs"

[[bin]]
name = "frozen_replay"
path = "src/rainbow_table/bin/frozen_replay.rs"

[[bin]]
name = "frozen_pilot"
path = "src/rainbow_table/bin/frozen_pilot.rs"

[[bin]]
name = "frozen_filter_persist"
path = "src/rainbow_table/bin/frozen_filter_persist.rs"

[[bin]]
name = "make_probes"
path = "src/rainbow_table/bin/make_probes.rs"

[[bin]]
name = "frozen_calibrate2"
path = "src/rainbow_table/bin/frozen_calibrate2.rs"

[[bin]]
name = "rocks_value_stats"
path = "src/rainbow_table/bin/value_stats.rs"

[[bin]]
name = "friend_stats"
path = "src/rainbow_table/bin/friend_stats.rs"

[profile.release]
overflow-checks = false
lto = "thin"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true

[dependencies]
rand = "0.9.0"
rayon = "1.10.0"
serde = { version = "1.0.217", features = ["derive"] }
lru = "0.12"
itertools = "0.13"
once_cell = "1.19"
dashmap = "6.1.0"
clap = { version = "4.5.46", features = ["derive"] }
smallvec = "1.15.1"
ctrlc = "3.2"
fastrand = "2.3.0"
pyo3 = { version = "0.27.1", features = ["extension-module"] }
numpy = "0.27.0"
lmdb = "0.8.0"
libc = "0.2.178"
lmdb-sys = "0.8.0"
signal-hook = "0.3.18"
primitive-types = "0.14.0"
uint = "0.10.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rustc-hash = "2"
# Rainbow-table DB generation pipeline (src/rainbow_table).
rocksdb = "0.24.0"
crossbeam-channel = "0.5.15"
num_cpus = "1.17.0"
# Frozen-table read path (src/replace/frozen.rs).
xorf = { version = "0.12", features = ["serde", "bincode"] }
bincode2 = { package = "bincode", version = "2" }
# Needed by the challenge binaries (block_cipher, poly_canon).
rng-entropy = "0.5.0"
cryptography = { package = "cryptography-rs", version = "0.5.0" }
