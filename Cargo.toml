[package]
name = "local_mixing"
version = "0.1.0"
edition = "2024"
default-run = "local_mixing_bin"
# Every executable is declared below. This prevents an experimental file from
# becoming a supported command merely because it was placed under src/bin/.
autobins = false

[lib]
name = "local_mixing"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "local_mixing_bin"
path = "src/main.rs"

# --- GSS_MIX production pipeline: the only three binaries the script runs ---
# Stages 1+2: sliced sandwich and gadgetization.
[[bin]]
name = "gen_sandwich_gadget"
path = "src/preprocessing/bin/gen_sandwich_gadget.rs"

# Stages 3-5: Phase A, split, and resumed crossing modes share fmix.
[[bin]]
name = "fmix"
path = "src/db_mixing/bin/fmix.rs"

# Stage 6: final fixed-point compression.
[[bin]]
name = "fcompress"
path = "src/postprocessing/bin/fcompress.rs"

# --- Manual artifact validators ---
[[bin]]
name = "verify_zero_slice"
path = "tests/manual/gss/verify_zero_slice.rs"

# --- Gauntlet trace generation and leakage audit ---
[[bin]]
name = "gauntlet_gen"
path = "tests/gauntlet/gauntlet_gen.rs"

[[bin]]
name = "gauntlet_audit"
path = "tests/gauntlet/gauntlet_audit.rs"

# --- GSS/circuit experiments: not invoked by scripts/gss_mix.sh ---
[[bin]]
name = "fragment_wide"
path = "experimental/circuit/fragment_wide.rs"

[[bin]]
name = "sandwich_compare"
path = "experimental/gss/sandwich_compare.rs"

[[bin]]
name = "check_output"
path = "experimental/gss/check_output.rs"

[[bin]]
name = "fsplit"
path = "experimental/postprocessing/fsplit.rs"

# --- Standalone challenge programs ---
[[bin]]
name = "block_cipher"
path = "challenges/block_cipher.rs"

[[bin]]
name = "point_function"
path = "challenges/point_function.rs"

[[bin]]
name = "poly_canon"
path = "challenges/poly_canon.rs"

[[bin]]
name = "newton_feistal"
path = "challenges/newton_feistal.rs"

# --- db_generation: frozen + curated replacement-store construction ---
# (see src/db_generation/README.md for the end-to-end recipe)
[[bin]]
name = "frozen_from_lmdb"
path = "src/db_generation/bin/frozen_from_lmdb.rs"

[[bin]]
name = "frozen_filters_build"
path = "src/db_generation/bin/frozen_filters_build.rs"

[[bin]]
name = "merge_rocks_parallel"
path = "src/db_generation/bin/merge_rocks_parallel.rs"
required-features = ["legacy-db-tools"]

[[bin]]
name = "build_curated_full"
path = "src/db_generation/bin/build_curated_full.rs"
required-features = ["legacy-db-tools"]

# --- DB-generation experiments: censuses/probes, not rebuild stages ---
[[bin]]
name = "curated_size_census"
path = "experimental/db_generation/curated_size_census.rs"
required-features = ["legacy-db-tools"]

[[bin]]
name = "curated_recanon_probe"
path = "experimental/db_generation/curated_recanon_probe.rs"
required-features = ["legacy-db-tools"]

[[bin]]
name = "curated_key_histogram"
path = "experimental/db_generation/curated_key_histogram.rs"
required-features = ["legacy-db-tools"]

[[bin]]
name = "curated_key_structure"
path = "experimental/db_generation/curated_key_structure.rs"
required-features = ["legacy-db-tools"]

[[bin]]
name = "curated_key_filter"
path = "experimental/db_generation/curated_key_filter.rs"
required-features = ["legacy-db-tools"]

[[bin]]
name = "curated_coverage_census"
path = "experimental/db_generation/curated_coverage_census.rs"
required-features = ["legacy-db-tools"]

[[bin]]
name = "identity_shingle_sieve"
path = "experimental/db_generation/identity_shingle_sieve.rs"

[[bin]]
name = "identity_length_census"
path = "experimental/db_generation/identity_length_census.rs"

[[bin]]
name = "cross_gluing_probe"
path = "experimental/db_generation/cross_gluing_probe.rs"
