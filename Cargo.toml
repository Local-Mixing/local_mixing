[package]
name = "local_mixing"
version = "0.1.0"
description = "GSS mixing for obfuscated reversible circuits"
edition = "2024"
default-run = "local_mixing_bin"
# Every executable is declared below. This prevents an experimental file from
# becoming a supported command merely because it was placed under src/bin/.
autobins = false

[lib]
name = "local_mixing"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enable extension-module linking only when packaging the Python extension.
# Rust binaries and tests retain normal libpython linkage.
python-extension = ["dep:pyo3", "dep:numpy", "pyo3/extension-module"]
# Historical workflows and comparison algorithms are excluded from normal GSS.
legacy-tools = ["dep:rhai"]
security-tools = ["legacy-tools"]
challenge-tools = ["legacy-tools", "dep:rng-entropy", "dep:cryptography"]
benchmark-tools = ["legacy-tools", "dep:cryptography"]
# Preferred name for database builders. The existing cfg gates and scripts
# still use legacy-db-tools, so keep both names working during reorganization.
db-tools = ["legacy-db-tools"]
# Offline import/regeneration tools for the historical replacement databases.
# Runtime lookup does not pull in RocksDB.
legacy-db-tools = [
    "dep:lmdb",
    "dep:crossbeam-channel",
    "dep:lru",
    "dep:num_cpus",
    "dep:rocksdb",
]

[profile.release]
# Explicit (it is also the release default): wrapping arithmetic is relied on in
# hot paths, while debug builds retain overflow checks for tests.
overflow-checks = false
lto = "thin"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true

[dependencies]
# Parse the operator recipe using the already-locked TOML parser.
toml_edit = { version = "0.23.10", default-features = false, features = ["parse"] }
rand = "0.9.0"
rayon = "1.10.0"
serde = { version = "1.0.217", features = ["derive"] }
itertools = "0.13"
once_cell = "1.19"
dashmap = "6.1.0"
clap = { version = "4.5.46", features = ["derive"] }
smallvec = "1.15.1"
ctrlc = "3.2"
fastrand = "2.3.0"
pyo3 = { version = "0.27.1", optional = true }
numpy = { version = "0.27.0", optional = true }
lmdb = { version = "0.8.0", optional = true }
libc = "0.2.178"
signal-hook = "0.3.18"
primitive-types = "0.14.0"
uint = "0.10.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rustc-hash = "2"
# Curated database build/import pipeline. These are optional because RocksDB
# is not part of the frozen-store runtime.
rocksdb = { version = "0.24.0", optional = true }
num_cpus = { version = "1.17.0", optional = true }
crossbeam-channel = { version = "0.5.15", optional = true }
lru = { version = "0.12", optional = true }
# Frozen-table read path (src/database/frozen.rs): xorf provides the optional
# in-RAM BinaryFuse8 miss filter, bincode2 decodes the persisted filters.bin.
xorf = { version = "0.12", features = ["serde", "bincode"] }
bincode2 = { package = "bincode", version = "2" }
# Embedded scripting for swappable ranking functions (outgoing/incoming subcircuit selection).
# `sync` makes Engine/AST Send+Sync so a script ranker can be shared across rayon threads.
rhai = { version = "1.21", features = ["sync"], optional = true }
# Needed by the challenge binaries (block_cipher, poly_canon).
rng-entropy = { version = "0.5.0", optional = true }
cryptography = { package = "cryptography-rs", version = "0.5.0", optional = true }

# Main command and GSS stages

[dev-dependencies]
# Integration fixtures build synthetic LMDB stores; normal frozen lookup does not.
lmdb = "0.8.0"

[[bin]]
name = "fcompress"
path = "src/entrypoints/fcompress.rs"

[[bin]]
name = "fmix"
path = "src/entrypoints/fmix.rs"

[[bin]]
name = "gen_sandwich_gadget"
path = "src/entrypoints/gen_sandwich_gadget.rs"

[[bin]]
name = "local_mixing_bin"
path = "src/main.rs"

