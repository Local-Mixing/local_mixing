[package]
name = "local_mixing"
version = "0.1.0"
edition = "2024"
default-run = "local_mixing_bin"

[lib]
name = "local_mixing"            
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "local_mixing_bin"
path = "src/main.rs"

# Standalone "challenge" binaries (pulled from eb/dev). Not in src/bin so they stay
# out of the main source tree; explicit paths make them runnable via `cargo run --bin <name>`.
[[bin]]
name = "block_cipher"
path = "challenges/block_cipher.rs"

[[bin]]
name = "point_function"
path = "challenges/point_function.rs"

[[bin]]
name = "poly_canon"
path = "challenges/poly_canon.rs"

[[bin]]
name = "newton_feistal"
path = "challenges/newton_feistal.rs"

[[bin]]
name = "bench_canon4"
path = "src/bench/bench_canon4.rs"

[[bin]]
name = "bench_polycanon"
path = "src/bench/bench_polycanon.rs"

[[bin]]
name = "frozen_from_lmdb"
path = "src/bin/frozen_from_lmdb.rs"

[[bin]]
name = "build_curated_full"
path = "src/rainbow_table/bin/build_curated_full.rs"
required-features = ["legacy-db-tools"]

[[bin]]
name = "curated_size_census"
path = "src/rainbow_table/bin/curated_size_census.rs"
required-features = ["legacy-db-tools"]

[[bin]]
name = "curated_recanon_probe"
path = "src/rainbow_table/bin/curated_recanon_probe.rs"
required-features = ["legacy-db-tools"]

[features]
default = []
# Offline import/regeneration tools for the historical replacement databases.
# Runtime lookup does not pull in RocksDB.
legacy-db-tools = ["dep:num_cpus", "dep:rocksdb"]

[profile.release]
overflow-checks = false
lto = "thin"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true

[dependencies]
rand = "0.9.0"
rayon = "1.10.0"
serde = { version = "1.0.217", features = ["derive"] }
lru = "0.12"
itertools = "0.13"
once_cell = "1.19"
dashmap = "6.1.0"
clap = { version = "4.5.46", features = ["derive"] }
smallvec = "1.15.1"
ctrlc = "3.2"
fastrand = "2.3.0"
pyo3 = { version = "0.27.1", features = ["extension-module"] }
numpy = "0.27.0"
lmdb = "0.8.0"
libc = "0.2.178"
lmdb-sys = "0.8.0"
signal-hook = "0.3.18"
primitive-types = "0.14.0"
uint = "0.10.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rustc-hash = "2"
# Curated database build/import pipeline. These are optional because RocksDB
# is not part of the frozen-store runtime.
rocksdb = { version = "0.24.0", optional = true }
num_cpus = { version = "1.17.0", optional = true }
# Frozen-table read path (src/replace/frozen.rs): xorf provides the optional
# in-RAM BinaryFuse8 miss filter, bincode2 decodes the persisted filters.bin.
xorf = { version = "0.12", features = ["serde", "bincode"] }
bincode2 = { package = "bincode", version = "2" }
# Embedded scripting for swappable ranking functions (outgoing/incoming subcircuit selection).
# `sync` makes Engine/AST Send+Sync so a script ranker can be shared across rayon threads.
rhai = { version = "1.21", features = ["sync"] }
# Needed by the challenge binaries (block_cipher, poly_canon).
rng-entropy = "0.5.0"
cryptography = { package = "cryptography-rs", version = "0.5.0" }
