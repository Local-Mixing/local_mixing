[[bin]]
name = "frozen_class_census"
path = "experimental/db_generation/frozen_class_census.rs"

[[bin]]
name = "minimal_identity_filter"
path = "experimental/db_generation/minimal_identity_filter.rs"

[[bin]]
name = "minimal_halves_probe"
path = "experimental/db_generation/minimal_halves_probe.rs"

# --- Benchmarks: measurement tools, not GSS_MIX stages ---
[[bin]]
name = "bench_canon4"
path = "benchmarks/canonicalization/bench_canon4.rs"

[[bin]]
name = "bench_polycanon"
path = "benchmarks/canonicalization/bench_polycanon.rs"

[[bin]]
name = "canon_probe"
path = "benchmarks/canonicalization/canon_probe.rs"

[[bin]]
