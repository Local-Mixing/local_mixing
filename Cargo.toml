[[bin]]
name = "ladder_mobility"
path = "experimental/mixing/ladder_mobility.rs"

[[bin]]
name = "leeway_by_width"
path = "experimental/mixing/leeway_by_width.rs"

[[bin]]
name = "pairfloat_exp"
path = "experimental/mixing/pairfloat_exp.rs"

[[bin]]
name = "fsplit_trace"
path = "experimental/postprocessing/fsplit_trace.rs"

# --- Red-team executables: attacks, leakage measurements, and fixtures ---
[[bin]]
name = "fcone"
path = "red_team_tests/bin/demixing/fcone.rs"

[[bin]]
name = "fmix_downhill"
path = "red_team_tests/bin/demixing/fmix_downhill.rs"

[[bin]]
name = "fmix_gauge_score"
path = "red_team_tests/bin/demixing/fmix_gauge_score.rs"

[[bin]]
name = "hmap"
path = "red_team_tests/bin/heatmaps/hmap.rs"

[[bin]]
name = "hmap_affine"
path = "red_team_tests/bin/heatmaps/hmap_affine.rs"

[[bin]]
name = "hmap_stat"
path = "red_team_tests/bin/heatmaps/hmap_stat.rs"

[[bin]]
name = "hmap_trace_affine"
path = "red_team_tests/bin/heatmaps/hmap_trace_affine.rs"

[[bin]]
