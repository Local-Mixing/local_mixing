# Example: run all six GSS steps with the current defaults.
# Copy this to configs/local.toml, then set database.regular_dir below.
# Relative paths are resolved from the repository root.
#
# Check: cargo run --release --locked -- gss --config configs/local.toml --dry-run
# Run:   cargo run --release --locked -- gss --config configs/local.toml
# Output: runs/<generated-run-name>/final.esop1
config_version = 1

[run]
build_binaries = true
stop_after_stage = 6
# directory = "runs/my-run"  # set this to continue an existing run

[source]
wires = 128
# Without a path, generate a random source with round(n * log2(n)^2) gates.
# gates = 6272  # optional size for a generated source
# path = "circuits/source.g57"  # use an existing G57 source instead

[database]
regular_dir = "/path/to/frozen"  # REQUIRED: replace with your regular frozen store
# curated_dir = "/path/to/curated"  # optional curated store
lookup_miss_filter = "auto"
allow_no_database_for_tests = false
# Stores contain tables.bin and shard_00.frz through shard_ff.frz.
# To use FROZEN_DB_DIR instead, remove regular_dir from this file.

[preprocessing]
mode = "quadratic-masking"
mask_pair_wires = 2
max_open_masks = 3
min_open_masks = 2
balanced_masks = true

[db_mixing]
target_size_factor = 2.0
hold_work_units = 27.0

[crossing]
target_size_factor = 2.0

# Other settings keep their defaults. See configs/gss.toml for the full template,
# including parallel execution, optional leakage repair, and crossing limits.
