<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="800" viewBox="0 0 1110 800" role="img" aria-labelledby="title desc">
<title id="title">Dirty helpers for cubic and quartic terms</title><desc id="desc">Top: the four-gate bracket adds abc to t and restores arbitrary h. Bottom: the eight-gate bracket adds abcd to t and restores arbitrary h1 and h2; products ac and bd pair factors from different operands ab and cd. All gates execute left to right.</desc>
