<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="342" viewBox="0 0 1040 342" role="img" aria-labelledby="title desc">
<title id="title">Reading the circuit diagrams</title><desc id="desc">r57 uses numbered control inputs in [target, first control, second control] order. CNOT and AND2 use ordinary positive or negative conjunction controls. Gates run left to right.</desc>
<rect width="1040" height="342" rx="12" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#586979"/></marker></defs>
<text x="28" y="34" fill="#183042" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">Reading the circuit diagrams</text>
<text x="35" y="76" fill="#183042" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600">r57 [t, b, c]</text>
<text x="380" y="76" fill="#183042" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600">CNOT</text>
<text x="715" y="76" fill="#183042" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600">AND2 / Toffoli</text>
<text x="69" y="119" fill="#183042" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18">b</text>
<line x1="85" y1="113" x2="280" y2="113" stroke="#8593a0" stroke-width="1.8"/>
<text x="69" y="169" fill="#183042" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18">c</text>
<line x1="85" y1="163" x2="280" y2="163" stroke="#8593a0" stroke-width="1.8"/>
<text x="69" y="219" fill="#183042" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18">t</text>
<line x1="85" y1="213" x2="280" y2="213" stroke="#8593a0" stroke-width="1.8"/>
<line x1="180" y1="113" x2="180" y2="213" stroke="#2165a8" stroke-width="1.8"/>
<circle cx="180" cy="113" r="9" fill="#2165a8" stroke="#2165a8" stroke-width="1.7"/>
<text x="180" y="117" fill="white" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600">1</text>
<circle cx="180" cy="163" r="9" fill="#2165a8" stroke="#2165a8" stroke-width="1.7"/>
<text x="180" y="167" fill="white" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600">2</text>
<rect x="155" y="199" width="50" height="28" rx="6" fill="#eaf2fa" stroke="#2165a8" stroke-width="1.5"/>
<text x="180" y="218" fill="#2165a8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">r57</text>
<text x="35" y="261" fill="#183042" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18">t′ = t ⊕ (b ∨ ¬c)</text>
<text x="414" y="143" fill="#183042" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18">b</text>
<line x1="430" y1="137" x2="630" y2="137" stroke="#8593a0" stroke-width="1.8"/>
<text x="414" y="219" fill="#183042" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18">t</text>
<line x1="430" y1="213" x2="630" y2="213" stroke="#8593a0" stroke-width="1.8"/>
<line x1="530" y1="137" x2="530" y2="213" stroke="#183042" stroke-width="1.8"/>
<circle cx="530" cy="137" r="5" fill="#183042" stroke="#183042" stroke-width="1.7"/>
<circle cx="530" cy="213" r="10" fill="white" stroke="#183042" stroke-width="1.7"/>
<line x1="520" y1="213" x2="540" y2="213" stroke="#183042" stroke-width="1.8"/>
<line x1="530" y1="203" x2="530" y2="223" stroke="#183042" stroke-width="1.8"/>
<text x="380" y="261" fill="#183042" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18">t′ = t ⊕ b</text>
<text x="749" y="119" fill="#183042" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18">b</text>
<line x1="765" y1="113" x2="990" y2="113" stroke="#8593a0" stroke-width="1.8"/>
<text x="749" y="169" fill="#183042" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18">c</text>
<line x1="765" y1="163" x2="990" y2="163" stroke="#8593a0" stroke-width="1.8"/>
<text x="749" y="219" fill="#183042" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18">t</text>
<line x1="765" y1="213" x2="990" y2="213" stroke="#8593a0" stroke-width="1.8"/>
<line x1="875" y1="113" x2="875" y2="213" stroke="#183042" stroke-width="1.8"/>
<circle cx="875" cy="113" r="5" fill="#183042" stroke="#183042" stroke-width="1.7"/>
<circle cx="875" cy="163" r="5" fill="#183042" stroke="#183042" stroke-width="1.7"/>
<circle cx="875" cy="213" r="10" fill="white" stroke="#183042" stroke-width="1.7"/>
<line x1="865" y1="213" x2="885" y2="213" stroke="#183042" stroke-width="1.8"/>
<line x1="875" y1="203" x2="875" y2="223" stroke="#183042" stroke-width="1.8"/>
<text x="715" y="261" fill="#183042" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18">t′ = t ⊕ bc</text>
<text x="28" y="295" fill="#586979" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16">r57: ① is b and ② is c. Numbered circles specify input order, not AND controls.</text>
<text x="28" y="323" fill="#586979" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16">For ordinary conjunction gates: ● reads 1, ○ reads 0, and ⊕ marks the wire being flipped.</text>
</svg>
