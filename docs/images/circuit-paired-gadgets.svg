<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="662" viewBox="0 0 1030 662" role="img" aria-labelledby="title desc">
<title id="title">The paired gadgets: SG and RG3</title><desc id="desc">The six r57 gates of SG operate on the five displayed share and pad wires. The target pad is untouched. RG3 applies the same r57 mask to both wires of one pair.</desc>
