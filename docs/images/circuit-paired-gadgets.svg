<text x="28" y="409" fill="#183042" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18">sₐ′ ⊕ rₐ = (sₐ ⊕ rₐ) ⊕ ((s<tspan baseline-shift="sub" font-size="75%">b</tspan> ⊕ r<tspan baseline-shift="sub" font-size="75%">b</tspan>) ∨ ¬(s<tspan baseline-shift="sub" font-size="75%">c</tspan> ⊕ r<tspan baseline-shift="sub" font-size="75%">c</tspan>))</text>
<text x="28" y="440" fill="#586979" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16">Both control-pair XORs are unchanged. Brackets name the slots in the gate list.</text>
