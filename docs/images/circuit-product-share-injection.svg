<line x1="575" y1="330" x2="595" y2="330" stroke="#183042" stroke-width="1.8"/>
<line x1="585" y1="320" x2="585" y2="340" stroke="#183042" stroke-width="1.8"/>
<line x1="755" y1="110" x2="755" y2="330" stroke="#183042" stroke-width="1.8"/>
<circle cx="755" cy="110" r="5" fill="#183042" stroke="#183042" stroke-width="1.7"/>
