<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Product-share mask injection</title><desc id="desc">The four terms of the toy mask are XORed directly into C1: B1 B2, not B1 times B3, B2 times not B4, and B1 times not B3 times B4. The final cubic term is a logical fragment that can be decomposed with a dirty helper.</desc>
<rect width="1000" height="430" rx="12" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#586979"/></marker></defs>
<text x="28" y="34" fill="#183042" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">Product-share mask injection</text>
<text x="129" y="116" fill="#183042" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18">B₁</text>
<line x1="145" y1="110" x2="845" y2="110" stroke="#8593a0" stroke-width="1.8"/>
<text x="129" y="168" fill="#183042" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18">B₂</text>
<line x1="145" y1="162" x2="845" y2="162" stroke="#8593a0" stroke-width="1.8"/>
<text x="129" y="220" fill="#183042" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18">B₃</text>
<line x1="145" y1="214" x2="845" y2="214" stroke="#8593a0" stroke-width="1.8"/>
<text x="129" y="272" fill="#183042" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18">B₄</text>
<line x1="145" y1="266" x2="845" y2="266" stroke="#8593a0" stroke-width="1.8"/>
<text x="129" y="336" fill="#183042" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18">C₁ = V₁</text>
<line x1="145" y1="330" x2="845" y2="330" stroke="#8593a0" stroke-width="1.8"/>
<line x1="245" y1="110" x2="245" y2="330" stroke="#183042" stroke-width="1.8"/>
<circle cx="245" cy="110" r="5" fill="#183042" stroke="#183042" stroke-width="1.7"/>
<circle cx="245" cy="162" r="5" fill="#183042" stroke="#183042" stroke-width="1.7"/>
<circle cx="245" cy="330" r="10" fill="white" stroke="#183042" stroke-width="1.7"/>
