<text x="245" y="79" fill="#183042" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17">B₁B₂</text>
<text x="415" y="79" fill="#183042" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17">(¬B₁)B₃</text>
<text x="585" y="79" fill="#183042" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17">B₂(¬B₄)</text>
<text x="755" y="79" fill="#183042" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17">B₁(¬B₃)B₄</text>
<text x="860" y="336" fill="#183042" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18">V₁ ⊕ M₁</text>
<text x="28" y="382" fill="#183042" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17">Each term goes straight into the carrier; M₁ is never gathered on a separate clean wire.</text>
<text x="28" y="410" fill="#586979" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15">Logical fragments shown here. The cubic fragment can be lowered with a dirty helper; κ₁ is omitted.</text>
</svg>
