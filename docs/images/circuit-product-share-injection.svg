<line x1="415" y1="110" x2="415" y2="330" stroke="#183042" stroke-width="1.8"/>
<circle cx="415" cy="110" r="5" fill="white" stroke="#183042" stroke-width="1.7"/>
<circle cx="415" cy="214" r="5" fill="#183042" stroke="#183042" stroke-width="1.7"/>
<circle cx="415" cy="330" r="10" fill="white" stroke="#183042" stroke-width="1.7"/>
<line x1="405" y1="330" x2="425" y2="330" stroke="#183042" stroke-width="1.8"/>
<line x1="415" y1="320" x2="415" y2="340" stroke="#183042" stroke-width="1.8"/>
<line x1="585" y1="162" x2="585" y2="330" stroke="#183042" stroke-width="1.8"/>
<circle cx="585" cy="162" r="5" fill="#183042" stroke="#183042" stroke-width="1.7"/>
