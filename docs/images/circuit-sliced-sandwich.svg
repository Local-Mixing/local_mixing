<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" role="img" aria-labelledby="title desc">
<title id="title">The classic sliced sandwich</title><desc id="desc">Before dispersing its copy CNOTs, the classic sandwich runs C interleaved with S1 on the low half, copies low into high with one CNOT per wire, then runs D interleaved with S2 on the low half. Slice gates read the high half and target the low half. On input x,zero the high output is C(x).</desc>
<rect width="1080" height="440" rx="12" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#586979"/></marker></defs>
<text x="28" y="34" fill="#183042" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">The classic sliced sandwich</text>
<line x1="130" y1="82" x2="906" y2="82" stroke="#586979" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="518.0" y="73" fill="#586979" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14">gates run left to right</text>
<text x="134" y="180" fill="#183042" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18">x  (n wires)</text>
<line x1="150" y1="174" x2="907" y2="174" stroke="#8593a0" stroke-width="1.8"/>
<text x="922" y="180" fill="#183042" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17">junk</text>
<text x="134" y="291" fill="#183042" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18">y = 0</text>
<line x1="150" y1="285" x2="907" y2="285" stroke="#8593a0" stroke-width="1.8"/>
<text x="922" y="291" fill="#183042" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17">C(x)</text>
<rect x="218" y="123" width="222" height="102" rx="6" fill="#eaf2fa" stroke="#2165a8" stroke-width="1.5"/>
<text x="329" y="166" fill="#2165a8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600">C interleaved</text>
<text x="329" y="193" fill="#2165a8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600">with S₁</text>
<line x1="329" y1="225" x2="329" y2="285" stroke="#2165a8" stroke-width="1.8"/>
<circle cx="329" cy="285" r="5" fill="#2165a8" stroke="#2165a8" stroke-width="1.7"/>
<rect x="680" y="123" width="222" height="102" rx="6" fill="#edf6f1" stroke="#24715d" stroke-width="1.5"/>
<text x="791" y="166" fill="#24715d" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600">D interleaved</text>
<text x="791" y="193" fill="#24715d" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600">with S₂</text>
<line x1="791" y1="225" x2="791" y2="285" stroke="#24715d" stroke-width="1.8"/>
<circle cx="791" cy="285" r="5" fill="#24715d" stroke="#24715d" stroke-width="1.7"/>
<line x1="556" y1="174" x2="556" y2="285" stroke="#183042" stroke-width="1.8"/>
<circle cx="556" cy="174" r="5" fill="#183042" stroke="#183042" stroke-width="1.7"/>
<circle cx="556" cy="285" r="10" fill="white" stroke="#183042" stroke-width="1.7"/>
<line x1="546" y1="285" x2="566" y2="285" stroke="#183042" stroke-width="1.8"/>
<line x1="556" y1="275" x2="556" y2="295" stroke="#183042" stroke-width="1.8"/>
<text x="556" y="121" fill="#183042" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18">N: n CNOTs</text>
<text x="215" y="338" fill="#183042" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18">(C(x), 0)</text>
<text x="480" y="338" fill="#183042" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18">(C(x), C(x))</text>
<text x="785" y="338" fill="#183042" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18">(junk, C(x))</text>
<text x="28" y="387" fill="#183042" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17">S₁ is dead while y = 0. After the copy, every remaining target is in the low half.</text>
<text x="28" y="420" fill="#586979" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16">Bundle diagram before copy-gate scattering: each line stands for n wires.</text>
</svg>
