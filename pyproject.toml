[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "local_mixing"
version = "0.1.0"
description = "GSS mixing for obfuscated reversible circuits with Python heatmap analysis"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
# Dependencies used by the retained heatmap and analysis scripts.
dependencies = [
    "numpy",
    "matplotlib",
    "pandas",
]

[tool.maturin]
# Preserve the existing `import local_mixing` API.
module-name = "local_mixing"
manifest-path = "Cargo.toml"
bindings = "pyo3"
features = ["python-extension"]
locked = true
