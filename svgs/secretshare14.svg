<svg xmlns="http://www.w3.org/2000/svg" width="1216" height="509" viewBox="0 0 1216 509" font-family="ui-monospace, Menlo, Consolas, monospace">
<title>secretshare14 — one source gate c ^= a | !b on secret-shared values</title>
<desc>The replicated per-gate body only: one SG (7-variant menu, sizes 4..6) + rg_freq=2 refresh gadgets (RG1/RG2 = 6, RG3 = 2).  Cost is a seeded draw: E = 36/7 + 2·14/3 ≈ 14.5 — the &#x27;14&#x27; in the name; seed 14 was chosen so this instance draws the average (6 + 6 + 2 = 14).  Share setup (cleartext→2-shared) and unshare (decoding) are fixed infrastructure, not part of the gadget.</desc>
<rect width="1216" height="509" fill="#ffffff"/>
<text x="608" y="30" font-size="17" text-anchor="middle">secretshare14 — one source gate c ^= a | !b on secret-shared values</text>
<text x="608" y="50" font-size="10.5" fill="#555" text-anchor="middle">The replicated per-gate body only: one SG (7-variant menu, sizes 4..6) + rg_freq=2 refresh gadgets (RG1/RG2 = 6, RG3 = 2). Cost is a seeded draw: E =</text>
<text x="608" y="65" font-size="10.5" fill="#555" text-anchor="middle">36/7 + 2·14/3 ≈ 14.5 — the &#x27;14&#x27; in the name; seed 14 was chosen so this instance draws the average (6 + 6 + 2 = 14). Share setup (cleartext→2-shared)</text>
<text x="608" y="80" font-size="10.5" fill="#555" text-anchor="middle">and unshare (decoding) are fixed infrastructure, not part of the gadget.</text>
